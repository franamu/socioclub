spring.application.name=socioclub

# ---------- Servidor ----------
server.port=8080

# ---------- Conexión a MySQL ----------
# createDatabaseIfNotExist=true crea el esquema "socioclub" si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/socioclub?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Cordoba&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update: Hibernate crea/actualiza las tablas a partir de las entidades.
# (Alternativa: usar el script base-datos/socioclub.sql y poner "validate")
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ---------- Datos iniciales ----------
# Ejecuta src/main/resources/data.sql después de que Hibernate crea las tablas.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# ---------- Formato de fechas en formularios (input type="date" => yyyy-MM-dd) ----------
spring.mvc.format.date=iso

# ---------- Thymeleaf ----------
# En desarrollo desactivamos la caché para ver los cambios en las vistas sin reiniciar
spring.thymeleaf.cache=false
